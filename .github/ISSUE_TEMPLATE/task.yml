name: Task
description: "A piece of work with a clear outcome: a feature, a change or a chore."
labels: ["type:chore"]
body:
  - type: markdown
    attributes:
      value: Do not include passwords, keys or personal data here.
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What is true when this is done.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The problem or goal behind it.
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Proposed approach
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
    validations:
      required: true
